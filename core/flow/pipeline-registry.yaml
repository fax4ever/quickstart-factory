  #   expected_inputs: []
  #   expected_outputs: []
  #   review_guidance: ""
  #   next_skill: rh-qs-document

  - id: rh-qs-document
    order: 6
    description: "Generate README and catalog documentation from verified deployment — deploy steps, requirements, architecture diagram, and catalog metadata"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/pipeline/doc-manifest.yaml"
        description: "Documentation handoff manifest with README section status and validation results"
    review_guidance: |
      - doc-manifest.yaml exists in [.rhoai-qs/{qs-name}/pipeline/doc-manifest.yaml](../../../.rhoai-qs/{qs-name}/pipeline/doc-manifest.yaml) and all validation booleans are true
      - README deploy commands match Makefile targets, no placeholder content remains
      - Review content: catalog metadata compliant, architecture diagram matches spec
      - Recommend getting a peer engineer review on the docs before continuing
    next_skill: rh-qs-ship

  - id: rh-qs-ship
    order: 7
    description: "Ship the quickstart — create PR with structured summary, generate blog post draft, and update backlog status"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/blog-drafts/{qs-name}-*.md"
        description: "Blog post draft following the template (Hook, What It Does, How It Works, Get Started, What's Next)"
    review_guidance: |
      - PR created with accurate summary, CI checks pass, no secrets in diff
      - Blog draft follows template from assets/blog-template.md with required links
      - Backlog issue commented on or status updated
      - Recommend getting a peer engineer review on the PR before merging
    next_skill: null
