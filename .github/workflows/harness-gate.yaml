# CI gate: validate skills, symlinks, hooks, and client sync.
name: Harness Gate

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'core/**'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.gemini/**'
      - '.github/workflows/harness-gate.yaml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'core/**'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.gemini/**'
      - '.github/workflows/harness-gate.yaml'
  workflow_dispatch:

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    # Non-blocking for now — acts as advisory second reviewer.
    # Will enforce after repo-wide upgrade resolves existing issues.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install skill-validator
        run: |
          go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.5.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          skill-validator --version

      - name: Validate changed skills
        run: bash .github/scripts/validate-skills.sh "${{ github.base_ref }}" core/skills

  validate-symlinks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Validate skill symlinks
        run: bash .github/scripts/validate-symlinks.sh

      - name: Validate OC-policy gate symlinks
        run: bash .github/scripts/validate-oc-policy-gate.sh

      - name: Detect sync drift
        run: |
          set -euo pipefail
          bash core/scripts/sync-clients.sh
          if ! git diff --exit-code -- .claude/skills .claude/hooks .codex .cursor .gemini; then
            echo "::error::Symlinks are out of sync. Run 'bash core/scripts/sync-clients.sh' and commit the result."
            exit 1
          fi
          echo "✅ No drift detected."

